[package]
name = "mcguffin-server"
edition = "2021"
version = "0.3.0"

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bcrypt = "0.19"
once_cell = "1"
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
toml_edit = "0.25"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.rusqlite]
version = "0.32"
features = ["backup", "bundled"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tower-http]
version = "0.6"
features = ["cors", "fs", "compression-gzip", "mime_guess"]

[dependencies.uuid]
version = "1"
features = ["v4"]

[[bin]]
path = "src/bin/mcguffin.rs"
name = "mcguffin"
edition = "2021"
required-features = []

[[bin]]
path = "src/main.rs"
name = "mcguffin-server"
edition = "2021"
required-features = []

[[test]]
path = "tests/api.rs"
name = "api"
edition = "2021"
required-features = []

[lib]
path = "src/lib.rs"
name = "mcguffin_server_lib"
edition = "2021"
required-features = []
crate-type = ["lib"]
