# ==========================================================
# McGuffin Docker Image Build & Push (多架构原生构建)
# ==========================================================
# 工作流说明：
#   1. build — 在原生 runner 上并行构建各架构，推送到 ghcr
#   2. merge — 合并各架构为多架构 manifest
#
# 触发与行为：
#   - push main       → 推 latest-{arch} 并合成 :latest
#   - push tag v*.*.* → 推 v{ver}-{arch} 并合成 :v{ver}
#   - pull_request    → 只构建、不登录、不推送（push=false），
#                       用于在合并前发现 Dockerfile / 构建上下文被改坏
#
# 优势：使用原生 ARM runner (ubuntu-24.04-arm) 而非 QEMU
# 模拟，arm64 构建速度提升 2-5 倍（尤其 Rust 编译）。
# ==========================================================

name: Docker

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:
    paths:
      - "Dockerfile"
      - "Containerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
      - "docker-compose.yml"
      - "web/**"
      - "server/**"
      - ".github/workflows/docker.yml"

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            platform_slug: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            platform_slug: linux-arm64
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: 🔑 Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GitHub 仓库名可能含大写字母，Docker tag 必须全小写
      - name: 🏷️ Resolve lowercased image name and tags
        id: tags
        shell: bash
        env:
          # REGISTRY 来自工作流级 env；GITHUB_REF/GITHUB_REF_NAME 为 runner 默认环境变量
          PLATFORM_SLUG: ${{ matrix.platform_slug }}
        run: |
          IMAGE="${GITHUB_REPOSITORY,,}"

          # Cache image tag — per-platform, persistent registry cache
          echo "cache-image=${REGISTRY}/${IMAGE}:cache-${PLATFORM_SLUG}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # PR：只验证能否构建，tag 仅作本地标识。
            # 必须用 PR 编号：pull_request 事件下 GITHUB_REF_NAME 是 "6/merge"
            # 这样的形式，直接拼进 tag 会得到非法引用（含 "/"）而构建失败。
            echo "push-tag=${REGISTRY}/${IMAGE}:pr-${{ github.event.pull_request.number }}-${PLATFORM_SLUG}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
            echo "push-tag=${REGISTRY}/${IMAGE}:${VERSION_TAG}-${PLATFORM_SLUG}" >> "$GITHUB_OUTPUT"
          else
            # 分支推送（main），推 latest 系列
            echo "push-tag=${REGISTRY}/${IMAGE}:latest-${PLATFORM_SLUG}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔨 Build and push (native ${{ matrix.platform_slug }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # PR 上只构建不推送：合并前即可发现 Dockerfile 被改坏
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.push-tag }}
          platforms: ${{ matrix.platform }}
          # 使用 registry 缓存：持久化到 ghcr.io，跨 runner 共享
          # PR 无法写入 registry 缓存（未登录），仅读取
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache-image }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.tags.outputs.cache-image) || '' }}
          provenance: false

  #
  # Job 2: 合并各平台为多架构 manifest
  #
  merge:
    needs: build
    # PR 上没有任何架构镜像被推送，跳过 manifest 合成
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔗 Create multi-arch manifest
        shell: bash
        run: |
          IMAGE="${GITHUB_REPOSITORY,,}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "→ 创建多架构 manifest: ${REGISTRY}/${IMAGE}:${TAG} (amd64 + arm64)"

            docker buildx imagetools create \
              -t "${REGISTRY}/${IMAGE}:${TAG}" \
              "${REGISTRY}/${IMAGE}:${TAG}-linux-amd64" \
              "${REGISTRY}/${IMAGE}:${TAG}-linux-arm64"

            echo "✓ 多架构 manifest 推送完成: ${REGISTRY}/${IMAGE}:${TAG}"
          else
            echo "→ 创建多架构 manifest: ${REGISTRY}/${IMAGE}:latest (amd64 + arm64)"

            docker buildx imagetools create \
              -t "${REGISTRY}/${IMAGE}:latest" \
              "${REGISTRY}/${IMAGE}:latest-linux-amd64" \
              "${REGISTRY}/${IMAGE}:latest-linux-arm64"

            echo "✓ 多架构 manifest 推送完成: ${REGISTRY}/${IMAGE}:latest"
          fi

      - name: 🔍 Verify manifest
        shell: bash
        run: |
          IMAGE="${GITHUB_REPOSITORY,,}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="latest"
          fi

          echo "→ 验证 manifest: ${REGISTRY}/${IMAGE}:${TAG}"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${TAG}"
